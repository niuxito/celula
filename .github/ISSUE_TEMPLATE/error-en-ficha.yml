name: Error en una ficha / Error in a card
description: Un dato incorrecto, impreciso o mal redactado en la ficha de un orgánulo
labels: ["contenido"]
body:
  - type: input
    id: estructura
    attributes:
      label: Orgánulo / Organelle
      description: Nombre tal como aparece en el visor
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Qué es incorrecto / What is wrong
    validations:
      required: true
  - type: textarea
    id: fuente
    attributes:
      label: Fuente / Source
      description: Libro, artículo o recurso de biología celular que respalda la corrección
    validations:
      required: false
